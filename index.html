function liang(cx, cy, s, mood = 'smile', hat = false) {
  const on = mood !== 'sleep', arm = on ? '#FFB63E' : '#7F76B3', hand = on ? '#FFD35C' : '#9B92C8';

  const hw = y => ht + (hb - ht) * (y - top) / (bot - top), sag = hb * .11;

  const rnd = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(opt.seed || 11);
  for (let i = 0; i < (opt.dots || 40); i++) { const y = top + (bot - top) * Math.sqrt(rnd()), x = cx + (rnd() * 2 - 1) * hw(y) * .9; g += ci(x.toFixed(0), y.toFixed(0), (hb * .008 + rnd() * hb * .009).toFixed(1), ['#FFF6D2', '#FFE27A', '#D9FFE9'][i % 3], `opacity="${(.45 + rnd() * .5).toFixed(2)}"`); }
  const rows = opt.rows || Array.from({ length: n }, (_, i) => top + (bot - top) * (i + .75) / (n + .25));
  rows.forEach((y, i) => { const h = hw(y); g += `<path d="M${cx - h} ${y} Q${cx} ${y + h * .22} ${cx + h} ${y}" fill="none" stroke="url(#gold)" stroke-width="${opt.rib || hb * .07}" stroke-linecap="round"/>`;
